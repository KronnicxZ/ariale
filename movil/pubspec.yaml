name: ariale_movil
description: "Arialé Studio — agenda y caja del estudio en el móvil."
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Meses y días en español dentro de los selectores de fecha de Material.
  flutter_localizations:
    sdk: flutter

  # Llamadas a la API del panel.
  http: ^1.2.2
  # Para decirle al servidor que lo que sube es una imagen y no un binario
  # cualquiera. Ya venía con `http`; aquí solo se declara para poder usarla.
  http_parser: ^4.1.2

  # Guarda el token de sesión y la URL del servidor entre arranques.
  shared_preferences: ^2.3.3

  # Abre WhatsApp (wa.me) y el marcador. Los avisos a clientas salen así:
  # mensaje ya escrito, la dueña pulsa enviar. Nada automático.
  url_launcher: ^6.3.1

  # Fechas y números en español de Venezuela.
  intl: ^0.20.2

  # Playfair Display para títulos y Plus Jakarta Sans para el resto, las
  # mismas de la página.
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.17
  font_awesome_flutter: ^11.0.0
  flutter_contacts: ^2.3.1

  # Avisa en el propio teléfono cuando se acerca la hora de una cita.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Avisa en el momento cuando una clienta agenda desde la web, aunque la
  # app esté cerrada: el servidor manda el push, Firebase lo entrega.
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0

  # Actualizarse sola: la app pregunta al servidor si hay una versión más
  # nueva, se baja el APK y abre el instalador de Android. Así no hay que
  # pasarles el archivo por WhatsApp cada vez que cambia algo.
  package_info_plus: ^8.1.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/marca/
